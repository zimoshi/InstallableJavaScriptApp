<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#007bff">
    <title>My Game</title>
    <style>
        *{
            font-family:system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        dialog {
            z-index: 9999;
            border: none;
            border-radius: 8px;
            padding: 24px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
            max-width: 400px;
        }

        dialog::backdrop {
            background-color: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(2px);
        }

        button {
            border-radius: 5px;
            background-color:grey;
            color:aliceblue;
        }

        button#install{display: none;background-color: aquamarine;}

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        iframe {
            display: block;
            width: 100vw;
            height: 100vh;
            border: none;
        }

        #floatingMenuBtn {
            position: fixed;
            bottom: 24px;
            right: 24px;
            z-index: 9998; /* High z-index to sit on top of the iframe but below the opened dialog */
            
            /* Styling */
            width: 56px;
            height: 56px;
            border: none;
            border-radius: 50%;
            background-color: #0076ff;
            color: white;
            font-size: 24px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            
            /* Layout centering the icon/text */
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s, background-color 0.2s;
        }

        /* Hover and Click Interactions */
        #floatingMenuBtn:hover {
            background-color: #0056b3;
            transform: scale(1.05);
        }

        #floatingMenuBtn:active {
            transform: scale(0.95);
        }


    </style>
</head>
<body>
    <iframe src="https://website/website"></iframe>
    <dialog id="myPopup">
        <h2>Welcome!</h2>
        <button id="install">Install as app</button>
        
        <button id="closePopup">Close</button>
    </dialog>

    <button id="floatingMenuBtn" aria-label="Open Menu">⚙️</button>


    <script src="main.js"></script>
</body>
</html>
